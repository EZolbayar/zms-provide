# Hereglegchiin kompyuter deerh SQL Server-iin holbolt. application.properties-iin utgyg darj bichne.
# SQL Server-iin hayag, nevtrekh ner, nuuts ug oorchlogdvol zovhon ene failyg zasna.
#
# encrypt=false: huuchin SQL Server (2008 / 2008 R2) shifrleltiig bariad holboltoo taslaj bolno.
# SQL Server ni ene kompyuter deeree (localhost) baigaa tul shifrlelt shaardlagagui.
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=Banker;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sqlserver

# Buh medeelel, aldaag ZMS havtsand log.txt fail ruu bichne. Aldaa garval ene failyg ilgeene.
# Log4j2 tohirgoo (log4j2-spring.xml) log.txt failyg oorooo uusgene.
