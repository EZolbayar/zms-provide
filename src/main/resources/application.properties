spring.application.name=zms-upload

server.port=8081

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Banker;integratedSecurity=true;trustServerCertificate=true;encrypt=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Use explicit @Table/@Column names as-is instead of Spring's snake_case rewriting.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
