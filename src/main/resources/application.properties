spring.application.name=zms-upload

server.port=8081

app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Banker;integratedSecurity=true;trustServerCertificate=true;encrypt=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Banker;trustServerCertificate=true;encrypt=true
# spring.datasource.username=sa
# spring.datasource.password=sqlserver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# schema.sql-ийг апп асах бүрд ажиллуулж TBCUSTOMERS хүснэгтийг үүсгэнэ (script нь давтан
# үүсгэхээс өөрөө сэргийлдэг). Hibernate-ийн ddl-auto нь none хэвээр тул бусад хүснэгт хөндөгдөхгүй.
spring.sql.init.mode=always
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Use explicit @Table/@Column names as-is instead of Spring's snake_case rewriting.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Pool sizing
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Timeouts (all in milliseconds)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000

